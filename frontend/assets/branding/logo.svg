<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="vmsBrandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="vmsCyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="vmsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#121218" stroke="url(#vmsBrandGrad)" stroke-width="2"/>
  
  <!-- Inner Background Glow -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1"/>

  <!-- Piano Key Bed (3 keys: Left white, Center white, Right white + 2 Black overlay keys) -->
  <g transform="translate(10, 16)" filter="url(#vmsGlow)">
    <!-- White Keys -->
    <rect x="0" y="0" width="7" height="32" rx="2" fill="#FFFFFF"/>
    <rect x="8" y="0" width="7" height="32" rx="2" fill="#FFFFFF"/>
    <rect x="16" y="0" width="7" height="32" rx="2" fill="#FFFFFF"/>
    <!-- Black Keys -->
    <rect x="5" y="0" width="4.5" height="19" rx="1" fill="#18181B"/>
    <rect x="13" y="0" width="4.5" height="19" rx="1" fill="#18181B"/>
  </g>

  <!-- Dynamic Waveform Signal Bars transitioning into Electric Cyan -->
  <g transform="translate(36, 16)" filter="url(#vmsGlow)">
    <rect x="0" y="8" width="4" height="16" rx="2" fill="url(#vmsBrandGrad)"/>
    <rect x="6" y="2" width="4" height="28" rx="2" fill="url(#vmsCyanGrad)"/>
    <rect x="12" y="6" width="4" height="20" rx="2" fill="url(#vmsBrandGrad)"/>
  </g>

  <!-- Sonic Signal Pulse Dot / Ring in Upper Right -->
  <circle cx="51" cy="13" r="3" fill="#22D3EE" filter="url(#vmsGlow)"/>
  <path d="M 47 7 C 52 5, 57 7, 59 11" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
</svg>
