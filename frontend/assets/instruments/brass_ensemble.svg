<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F160A"/>
      <stop offset="50%" stop-color="#33220E"/>
      <stop offset="100%" stop-color="#120C04"/>
    </linearGradient>
    <radialGradient id="brassSpot2" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brightGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="brassShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgBrass)"/>
  <circle cx="160" cy="90" r="110" fill="url(#brassSpot2)"/>
  
  <g filter="url(#brassShadow)">
    <!-- French Horn Bell & Wrap (Left Back) -->
    <g transform="translate(40, 40)">
      <circle cx="45" cy="45" r="32" fill="none" stroke="url(#brightGold)" stroke-width="6"/>
      <circle cx="45" cy="45" r="22" fill="none" stroke="url(#brightGold)" stroke-width="4"/>
      <!-- French Horn Wide Flared Bell -->
      <ellipse cx="25" cy="65" rx="20" ry="32" fill="url(#brightGold)" stroke="#FEF08A" stroke-width="1.2" transform="rotate(-30 25 65)"/>
      <ellipse cx="25" cy="65" rx="14" ry="24" fill="#451A03" transform="rotate(-30 25 65)"/>
    </g>

    <!-- Tenor Trombone Slide & Bell (Right Center) -->
    <g transform="translate(140, 25)">
      <line x1="20" y1="85" x2="150" y2="85" stroke="url(#brightGold)" stroke-width="5" stroke-linecap="round"/>
      <line x1="20" y1="92" x2="150" y2="92" stroke="url(#brightGold)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 20 85 C 10 85, 10 92, 20 92" stroke="url(#brightGold)" stroke-width="5" fill="none"/>
      <!-- Trombone Flared Bell -->
      <path d="M 50 85 L 125 55 L 130 75 L 50 85 Z" fill="url(#brightGold)"/>
      <ellipse cx="128" cy="65" rx="7" ry="16" fill="url(#brightGold)" stroke="#FEF08A" stroke-width="1"/>
      <ellipse cx="128" cy="65" rx="4" ry="12" fill="#451A03"/>
    </g>

    <!-- Orchestral Bb Trumpet (Foreground Center) -->
    <g transform="translate(90, 85)">
      <!-- Mouthpiece -->
      <polygon points="10,22 18,20 18,24" fill="#FEF08A"/>
      <!-- Leadpipe & Tuning Slide -->
      <line x1="18" y1="22" x2="135" y2="22" stroke="url(#brightGold)" stroke-width="4"/>
      <line x1="18" y1="29" x2="70" y2="29" stroke="url(#brightGold)" stroke-width="4"/>
      
      <!-- 3 Piston Valves with Pearl Finger Buttons -->
      <g fill="url(#brightGold)" stroke="#78350F" stroke-width="0.8">
        <rect x="58" y="12" width="6" height="25" rx="1"/>
        <rect x="67" y="12" width="6" height="25" rx="1"/>
        <rect x="76" y="12" width="6" height="25" rx="1"/>
      </g>
      <!-- Valve Pearls -->
      <circle cx="61" cy="9" r="2.5" fill="#FEF3C7"/>
      <circle cx="70" cy="9" r="2.5" fill="#FEF3C7"/>
      <circle cx="79" cy="9" r="2.5" fill="#FEF3C7"/>

      <!-- Trumpet Flaring Bell -->
      <path d="M 85 22 L 135 15 L 135 30 L 85 22 Z" fill="url(#brightGold)"/>
      <ellipse cx="135" cy="22" rx="4" ry="12" fill="url(#brightGold)" stroke="#FEF08A" stroke-width="0.8"/>
      <ellipse cx="135" cy="22" rx="2" ry="8" fill="#451A03"/>
    </g>
  </g>
  
  <text x="20" y="186" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SYMPHONIC BRASS ENSEMBLE</text>
  <text x="280" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">TRUMPET • TROMBONE • FRENCH HORN</text>
</svg>
