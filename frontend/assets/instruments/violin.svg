<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgViolin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A110E"/>
      <stop offset="50%" stop-color="#2D1A14"/>
      <stop offset="100%" stop-color="#0E0806"/>
    </linearGradient>
    <radialGradient id="violinSpot" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="varnishFlame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="30%" stop-color="#C2410C"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="violinShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgViolin)"/>
  <circle cx="160" cy="90" r="110" fill="url(#violinSpot)"/>
  
  <g filter="url(#violinShadow)">
    <!-- Violin Scroll & Pegbox -->
    <path d="M 30 95 C 24 90, 26 80, 36 82 C 45 84, 46 95, 52 95 L 68 95 L 68 105 L 50 105 Z" fill="#451A03" stroke="#B45309" stroke-width="0.8"/>
    <circle cx="56" cy="91" r="2.5" fill="#18181B"/>
    <circle cx="64" cy="91" r="2.5" fill="#18181B"/>
    <circle cx="58" cy="109" r="2.5" fill="#18181B"/>
    <circle cx="66" cy="109" r="2.5" fill="#18181B"/>

    <!-- Ebony Fingerboard -->
    <rect x="68" y="96" width="90" height="8" rx="1" fill="#18181B" stroke="#27272A" stroke-width="0.5"/>

    <!-- Italian Violin Body (Archtop with C-Bouts) -->
    <g transform="translate(145, 30)">
      <!-- Master violin outline with Bout corners -->
      <path d="M 12 70 C 8 48, 38 42, 54 50 C 70 58, 68 66, 62 70 C 58 74, 56 82, 60 88 C 66 94, 76 96, 76 110 C 76 128, 48 136, 34 136 C 18 136, -4 126, -2 108 C 0 96, 12 92, 16 86 C 20 80, 18 74, 12 70 Z" fill="url(#varnishFlame)" stroke="#FDBA74" stroke-width="1.2"/>
      
      <!-- Classic F-Holes -->
      <path d="M 24 80 Q 22 74 27 72 Q 31 72 30 78 Q 28 88 32 94 Q 34 98 30 100 Q 26 100 27 94 Z" fill="#1C0A05"/>
      <path d="M 52 80 Q 50 74 55 72 Q 59 72 58 78 Q 56 88 60 94 Q 62 98 58 100 Q 54 100 55 94 Z" fill="#1C0A05"/>

      <!-- Maple Bridge -->
      <path d="M 38 88 L 44 88 L 46 94 L 36 94 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="0.5"/>
      
      <!-- Ebony Tailpiece & Fine Tuners -->
      <polygon points="41,98 43,124 37,124 39,98" fill="#09090B"/>
      <!-- Chinrest -->
      <ellipse cx="20" cy="120" rx="10" ry="14" fill="#18181B"/>
    </g>

    <!-- 4 Steel Strings (G, D, A, E) -->
    <line x1="56" y1="97" x2="186" y2="128" stroke="#E2E8F0" stroke-width="0.7"/>
    <line x1="58" y1="99" x2="187" y2="129" stroke="#E2E8F0" stroke-width="0.8"/>
    <line x1="60" y1="101" x2="188" y2="130" stroke="#F8FAFC" stroke-width="0.9"/>
    <line x1="62" y1="103" x2="189" y2="131" stroke="#FDE68A" stroke-width="1.1"/>

    <!-- Pernambuco Wood Bow -->
    <line x1="45" y1="162" x2="275" y2="38" stroke="#78350F" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="47" y1="165" x2="273" y2="41" stroke="#FEF08A" stroke-width="1.2" opacity="0.85"/>
  </g>
  
  <text x="20" y="186" fill="#FB923C" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">ORCHESTRAL SOLO VIOLIN</text>
  <text x="280" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">STRADIVARI • PERNAMBUCO BOW</text>
</svg>
