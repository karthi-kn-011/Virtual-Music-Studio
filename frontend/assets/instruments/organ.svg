<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOrgan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1610"/>
      <stop offset="50%" stop-color="#2D1F14"/>
      <stop offset="100%" stop-color="#0E0B08"/>
    </linearGradient>
    <radialGradient id="organSpot" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipeGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="35%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="organWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#592E17"/>
      <stop offset="50%" stop-color="#3D1C0B"/>
      <stop offset="100%" stop-color="#1F0D04"/>
    </linearGradient>
    <filter id="organShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgOrgan)"/>
  <circle cx="160" cy="85" r="110" fill="url(#organSpot)"/>
  
  <!-- Majestic Church / Tonewheel Organ Pipes in Background -->
  <g filter="url(#organShadow)">
    <rect x="70" y="30" width="10" height="90" rx="4" fill="url(#pipeGold)"/>
    <rect x="85" y="22" width="12" height="98" rx="5" fill="url(#pipeGold)"/>
    <rect x="102" y="15" width="14" height="105" rx="6" fill="url(#pipeGold)"/>
    <rect x="121" y="8" width="16" height="112" rx="7" fill="url(#pipeGold)"/>
    
    <!-- Center Pipe Peak -->
    <rect x="142" y="5" width="18" height="115" rx="8" fill="url(#pipeGold)"/>
    <rect x="165" y="5" width="18" height="115" rx="8" fill="url(#pipeGold)"/>
    
    <rect x="188" y="8" width="16" height="112" rx="7" fill="url(#pipeGold)"/>
    <rect x="209" y="15" width="14" height="105" rx="6" fill="url(#pipeGold)"/>
    <rect x="228" y="22" width="12" height="98" rx="5" fill="url(#pipeGold)"/>
    <rect x="245" y="30" width="10" height="90" rx="4" fill="url(#pipeGold)"/>
    
    <!-- Pipe Mouths Cutouts -->
    <g fill="#451A03">
      <polygon points="71,95 79,95 75,91"/>
      <polygon points="86,95 96,95 91,91"/>
      <polygon points="103,95 115,95 109,91"/>
      <polygon points="122,95 136,95 129,90"/>
      <polygon points="144,95 158,95 151,90"/>
      <polygon points="167,95 181,95 174,90"/>
      <polygon points="190,95 202,95 196,90"/>
      <polygon points="210,95 222,95 216,91"/>
      <polygon points="229,95 239,95 234,91"/>
      <polygon points="246,95 254,95 250,91"/>
    </g>

    <!-- Dual Manual Console Front -->
    <rect x="60" y="105" width="200" height="60" rx="4" fill="url(#organWood)" stroke="#B45309" stroke-width="1.5"/>
    
    <!-- Upper Swell Manual Keys -->
    <g transform="translate(75, 112)">
      <rect x="0" y="0" width="170" height="18" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <!-- Black key dashes -->
      <line x1="15" y1="0" x2="15" y2="11" stroke="#000" stroke-width="3"/>
      <line x1="30" y1="0" x2="30" y2="11" stroke="#000" stroke-width="3"/>
      <line x1="55" y1="0" x2="55" y2="11" stroke="#000" stroke-width="3"/>
      <line x1="70" y1="0" x2="70" y2="11" stroke="#000" stroke-width="3"/>
      <line x1="85" y1="0" x2="85" y2="11" stroke="#000" stroke-width="3"/>
      <line x1="110" y1="0" x2="110" y2="11" stroke="#000" stroke-width="3"/>
      <line x1="125" y1="0" x2="125" y2="11" stroke="#000" stroke-width="3"/>
      <line x1="150" y1="0" x2="150" y2="11" stroke="#000" stroke-width="3"/>
    </g>
    
    <!-- Lower Great Manual Keys -->
    <g transform="translate(75, 134)">
      <rect x="0" y="0" width="170" height="22" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <line x1="15" y1="0" x2="15" y2="13" stroke="#000" stroke-width="3"/>
      <line x1="30" y1="0" x2="30" y2="13" stroke="#000" stroke-width="3"/>
      <line x1="55" y1="0" x2="55" y2="13" stroke="#000" stroke-width="3"/>
      <line x1="70" y1="0" x2="70" y2="13" stroke="#000" stroke-width="3"/>
      <line x1="85" y1="0" x2="85" y2="13" stroke="#000" stroke-width="3"/>
      <line x1="110" y1="0" x2="110" y2="13" stroke="#000" stroke-width="3"/>
      <line x1="125" y1="0" x2="125" y2="13" stroke="#000" stroke-width="3"/>
      <line x1="150" y1="0" x2="150" y2="13" stroke="#000" stroke-width="3"/>
    </g>
    
    <!-- Drawbars on Left & Right -->
    <rect x="63" y="115" width="8" height="30" rx="1" fill="#78350F"/>
    <rect x="249" y="115" width="8" height="30" rx="1" fill="#78350F"/>
  </g>
  
  <text x="20" y="186" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CATHEDRAL & TONEWHEEL ORGAN</text>
  <text x="280" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">PIPES • DRAWBARS</text>
</svg>
