  <text x="20" y="186" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">AUDITORIUM CONCERT PIANO</text>
  <text x="280" y="186" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="end">CONCERT HALL REVERB</text>
