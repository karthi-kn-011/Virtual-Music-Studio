<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <radialGradient id="hallAura" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="concertBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="hallShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgHall)"/>
  <circle cx="160" cy="85" r="110" fill="url(#hallAura)"/>
  
  <!-- Architectural Reverb Waves -->
  <path d="M 30 140 C 90 60, 230 60, 290 140" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <path d="M 50 140 C 100 80, 220 80, 270 140" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>
  <path d="M 70 140 C 110 100, 210 100, 250 140" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Grand Auditorium Model -->
