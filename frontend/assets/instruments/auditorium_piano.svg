    <line x1="185" y1="46" x2="165" y2="88" stroke="#FDE68A" stroke-width="2"/>
    
    <rect x="55" y="118" width="185" height="32" rx="2" fill="#0A0F1D" stroke="#0284C7" stroke-width="1"/>
    
    <!-- Keys -->
