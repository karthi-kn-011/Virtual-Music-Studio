<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgUpright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181313"/>
      <stop offset="50%" stop-color="#241B18"/>
      <stop offset="100%" stop-color="#0E0B0A"/>
    </linearGradient>
    <radialGradient id="amberSpot" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodgrain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A3222"/>
      <stop offset="40%" stop-color="#7C442A"/>
      <stop offset="70%" stop-color="#4B271A"/>
      <stop offset="100%" stop-color="#381D13"/>
    </linearGradient>
    <linearGradient id="goldBrass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="uprightShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgUpright)"/>
  <circle cx="160" cy="90" r="110" fill="url(#amberSpot)"/>
  
  <!-- Upright Piano Vertical Silhouette -->
  <g filter="url(#uprightShadow)">
    <!-- Top Cap / Upper Board -->
    <rect x="70" y="30" width="180" height="10" rx="2" fill="#3D2115" stroke="#F59E0B" stroke-width="0.7"/>
    <!-- Upper Front Panel (Walnut/Mahogany) -->
    <rect x="75" y="40" width="170" height="70" rx="3" fill="url(#woodgrain)" stroke="#92400E" stroke-width="1"/>
    
    <!-- Music Desk / Book Stand -->
    <rect x="110" y="85" width="100" height="15" rx="1" fill="#2E180D" stroke="#D97706" stroke-width="0.5"/>
    <line x1="120" y1="92" x2="150" y2="92" stroke="#FDE68A" stroke-width="1" opacity="0.6"/>
    <line x1="170" y1="92" x2="200" y2="92" stroke="#FDE68A" stroke-width="1" opacity="0.6"/>
    
    <!-- Key Bed / Shelf -->
    <rect x="65" y="110" width="190" height="28" rx="2" fill="#24140C" stroke="#F59E0B" stroke-width="1"/>
    
    <!-- Keys Layout -->
    <g transform="translate(70, 112)">
      <!-- 13 White Keys -->
      <rect x="0" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="13.5" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="27" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="40.5" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="54" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="67.5" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="81" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="94.5" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="108" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="121.5" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="135" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="148.5" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="162" y="0" width="13" height="24" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      
      <!-- Black Keys -->
      <rect x="9" y="0" width="8" height="14" rx="1" fill="#18181B"/>
      <rect x="23" y="0" width="8" height="14" rx="1" fill="#18181B"/>
      <rect x="50" y="0" width="8" height="14" rx="1" fill="#18181B"/>
      <rect x="63.5" y="0" width="8" height="14" rx="1" fill="#18181B"/>
      <rect x="77" y="0" width="8" height="14" rx="1" fill="#18181B"/>
      <rect x="104" y="0" width="8" height="14" rx="1" fill="#18181B"/>
      <rect x="117.5" y="0" width="8" height="14" rx="1" fill="#18181B"/>
      <rect x="144.5" y="0" width="8" height="14" rx="1" fill="#18181B"/>
      <rect x="158" y="0" width="8" height="14" rx="1" fill="#18181B"/>
    </g>
    
    <!-- Lower Front Board -->
    <rect x="75" y="138" width="170" height="36" fill="url(#woodgrain)" stroke="#92400E" stroke-width="1"/>
    <!-- Side Pilasters / Support Legs -->
    <rect x="67" y="136" width="10" height="38" rx="2" fill="#2E180D"/>
    <rect x="243" y="136" width="10" height="38" rx="2" fill="#2E180D"/>
    
    <!-- Brass Pedals -->
    <circle cx="154" cy="172" r="3.5" fill="url(#goldBrass)"/>
    <circle cx="166" cy="172" r="3.5" fill="url(#goldBrass)"/>
  </g>
  
  <text x="20" y="186" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">ACOUSTIC UPRIGHT PIANO</text>
  <text x="270" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">FELT HAMMERS • WARM</text>
</svg>
