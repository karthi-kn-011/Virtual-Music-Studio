<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPerc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19131F"/>
      <stop offset="50%" stop-color="#261A33"/>
      <stop offset="100%" stop-color="#0E0A14"/>
    </linearGradient>
    <radialGradient id="percSpot" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snareSilver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cymbalBronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="percShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgPerc)"/>
  <circle cx="160" cy="90" r="110" fill="url(#percSpot)"/>
  
  <g filter="url(#percShadow)">
    <!-- 20-inch Ride Cymbal (Top Left) -->
    <ellipse cx="90" cy="55" rx="55" ry="18" fill="url(#cymbalBronze)" stroke="#FDE68A" stroke-width="0.8"/>
    <ellipse cx="90" cy="55" rx="12" ry="4" fill="#78350F"/>
    <line x1="90" y1="55" x2="90" y2="140" stroke="#64748B" stroke-width="3"/>

    <!-- Latin Wood Bongo / Conga (Right) -->
    <g transform="translate(195, 45)">
      <ellipse cx="40" cy="25" rx="30" ry="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
      <path d="M 10 25 C 10 80, 20 95, 25 105 L 55 105 C 60 95, 70 80, 70 25 Z" fill="#9A3412" stroke="#B45309" stroke-width="1.5"/>
      <!-- Tuning Lugs -->
      <line x1="15" y1="30" x2="25" y2="85" stroke="#CBD5E1" stroke-width="1.8"/>
      <line x1="65" y1="30" x2="55" y2="85" stroke="#CBD5E1" stroke-width="1.8"/>
    </g>

    <!-- Orchestral Snare Drum (Center Foreground) -->
    <g transform="translate(100, 80)">
      <!-- Batter Head -->
      <ellipse cx="60" cy="22" rx="48" ry="15" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <!-- Chrome Beaded Shell -->
      <path d="M 12 22 L 12 55 C 12 65, 108 65, 108 55 L 108 22 Z" fill="url(#snareSilver)" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="12" y1="38" x2="108" y2="38" stroke="#475569" stroke-width="1.5"/>
      
      <!-- Drum Sticks -->
      <line x1="20" y1="0" x2="70" y2="22" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="100" y1="0" x2="50" y2="22" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <!-- Castanets / Shaker Icon in Corner -->
    <circle cx="50" cy="135" r="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="58" cy="138" r="10" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
  </g>
  
  <text x="20" y="186" fill="#C084FC" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">MIXED ACOUSTIC PERCUSSION</text>
  <text x="280" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">SNARE • CYMBAL • CONGA</text>
</svg>
