<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFlute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191910"/>
      <stop offset="50%" stop-color="#282815"/>
      <stop offset="100%" stop-color="#0E0E08"/>
    </linearGradient>
    <radialGradient id="fluteSpot" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#CA8A04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bambooCane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="35%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <filter id="fluteShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgFlute)"/>
  <circle cx="160" cy="90" r="110" fill="url(#fluteSpot)"/>
  
  <g filter="url(#fluteShadow)">
    <!-- Andean Siku / Zampona Curved Bamboo Pipe Array (15 Pipes) -->
    <g transform="translate(45, 30)">
      <rect x="0" y="0" width="12" height="120" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="15" y="0" width="12" height="113" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="30" y="0" width="12" height="106" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="45" y="0" width="12" height="99" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="60" y="0" width="12" height="92" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="75" y="0" width="12" height="85" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="90" y="0" width="12" height="78" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="105" y="0" width="12" height="71" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="120" y="0" width="12" height="64" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="135" y="0" width="12" height="57" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="150" y="0" width="12" height="50" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="165" y="0" width="12" height="43" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="180" y="0" width="12" height="36" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="195" y="0" width="12" height="29" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>
      <rect x="210" y="0" width="12" height="22" rx="4" fill="url(#bambooCane)" stroke="#713F12" stroke-width="0.8"/>

      <!-- Mouthpiece Openings at top -->
      <g fill="#451A03">
        <ellipse cx="6" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="21" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="36" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="51" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="66" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="81" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="96" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="111" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="126" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="141" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="156" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="171" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="186" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="201" cy="3" rx="4.5" ry="2"/>
        <ellipse cx="216" cy="3" rx="4.5" ry="2"/>
      </g>

      <!-- Traditional Woven Fabric Binding Ribbon -->
      <rect x="-6" y="14" width="234" height="6" rx="1" fill="#DC2626" stroke="#991B1B" stroke-width="0.5"/>
      <line x1="-6" y1="17" x2="228" y2="17" stroke="#FEF08A" stroke-width="1.2" stroke-dasharray="4 4"/>
      
      <!-- Lower Binding Cane Splint -->
      <rect x="-4" y="24" width="180" height="4" rx="1" fill="#713F12"/>
    </g>
  </g>
  
  <text x="20" y="186" fill="#FACC15" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">ANDEAN PAN FLUTE (ZAMPOÑA)</text>
  <text x="280" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">CANE REEDS • BREATH RESONANCE</text>
</svg>
