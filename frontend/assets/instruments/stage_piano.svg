<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14141E"/>
      <stop offset="50%" stop-color="#1F1D30"/>
      <stop offset="100%" stop-color="#0A0A10"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="anodizedChassis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="30%" stop-color="#DC2626"/>
      <stop offset="70%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <filter id="stageShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgStage)"/>
  <circle cx="160" cy="95" r="115" fill="url(#stageGlow)"/>
  
  <!-- Nord Style Professional Red Stage Keyboard -->
  <g filter="url(#stageShadow)">
    <!-- Red Anodized Aluminum Chassis -->
    <rect x="35" y="65" width="250" height="75" rx="6" fill="url(#anodizedChassis)" stroke="#F43F5E" stroke-width="1.2"/>
    
    <!-- Wooden End Cheeks -->
    <rect x="35" y="65" width="10" height="75" rx="3" fill="#451A03" stroke="#78350F" stroke-width="0.8"/>
    <rect x="275" y="65" width="10" height="75" rx="3" fill="#451A03" stroke="#78350F" stroke-width="0.8"/>
    
    <!-- Upper Control Surface / OLED screen & LED encoders -->
    <rect x="52" y="72" width="216" height="30" rx="3" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    
    <!-- OLED Screen -->
    <rect x="135" y="77" width="50" height="20" rx="2" fill="#0284C7" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="160" y="90" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="700" text-anchor="middle">STAGE PRO</text>
    
    <!-- Knobs & Buttons Row -->
    <circle cx="68" cy="87" r="5" fill="#27272A" stroke="#EF4444" stroke-width="1"/>
    <circle cx="84" cy="87" r="5" fill="#27272A" stroke="#EF4444" stroke-width="1"/>
    <circle cx="100" cy="87" r="5" fill="#27272A" stroke="#EF4444" stroke-width="1"/>
    <circle cx="116" cy="87" r="5" fill="#27272A" stroke="#EF4444" stroke-width="1"/>
    
    <circle cx="202" cy="87" r="5" fill="#27272A" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="218" cy="87" r="5" fill="#27272A" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="234" cy="87" r="5" fill="#27272A" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="250" cy="87" r="5" fill="#27272A" stroke="#10B981" stroke-width="1"/>
    
    <!-- 88-Key Bed Surface -->
    <g transform="translate(48, 105)">
      <!-- White Keys -->
      <rect x="0" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="14.8" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="29.6" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="44.4" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="59.2" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="74" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="88.8" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="103.6" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="118.4" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="133.2" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="148" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="162.8" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="177.6" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="192.4" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="207.2" y="0" width="14" height="32" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      
      <!-- Black Keys -->
      <rect x="10" y="0" width="9" height="19" rx="1" fill="#09090B"/>
      <rect x="25" y="0" width="9" height="19" rx="1" fill="#09090B"/>
      <rect x="54.5" y="0" width="9" height="19" rx="1" fill="#09090B"/>
      <rect x="69.5" y="0" width="9" height="19" rx="1" fill="#09090B"/>
      <rect x="84.5" y="0" width="9" height="19" rx="1" fill="#09090B"/>
      <rect x="114" y="0" width="9" height="19" rx="1" fill="#09090B"/>
      <rect x="129" y="0" width="9" height="19" rx="1" fill="#09090B"/>
      <rect x="158.5" y="0" width="9" height="19" rx="1" fill="#09090B"/>
      <rect x="173.5" y="0" width="9" height="19" rx="1" fill="#09090B"/>
      <rect x="188.5" y="0" width="9" height="19" rx="1" fill="#09090B"/>
    </g>
    
    <!-- X-Stand Silhouette -->
    <path d="M 65 140 L 120 185 M 255 140 L 200 185" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <path d="M 120 140 L 65 185 M 200 140 L 255 185" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <text x="20" y="186" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PRO DIGITAL STAGE PIANO</text>
  <text x="280" y="186" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="end">HAMMER ACTION • DSP</text>
</svg>
