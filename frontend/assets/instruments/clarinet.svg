<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClarinet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14141E"/>
      <stop offset="50%" stop-color="#1E1E2C"/>
      <stop offset="100%" stop-color="#0A0A10"/>
    </linearGradient>
    <radialGradient id="clariSpot" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grenadillaWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="silverPlating" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="clariShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgClarinet)"/>
  <circle cx="160" cy="90" r="110" fill="url(#clariSpot)"/>
  
  <g filter="url(#clariShadow)">
    <!-- African Blackwood (Grenadilla) Cylindrical Bb Clarinet Body (Angled diagonally) -->
    <g transform="rotate(-15 160 100)">
      <!-- Mouthpiece with Silver Ligature -->
      <polygon points="50,96 68,96 66,104 50,104" fill="#09090B"/>
      <rect x="58" y="95" width="6" height="10" rx="1" fill="url(#silverPlating)"/>

      <!-- Barrel Joint with Silver Rings -->
      <rect x="68" y="95" width="22" height="10" rx="1" fill="url(#grenadillaWood)"/>
      <rect x="67" y="94" width="2" height="12" fill="url(#silverPlating)"/>
      <rect x="89" y="94" width="2" height="12" fill="url(#silverPlating)"/>

      <!-- Upper Joint with Boehm System Silver Keys -->
      <rect x="91" y="96" width="70" height="8" fill="url(#grenadillaWood)"/>
      <circle cx="105" cy="100" r="2.8" fill="url(#silverPlating)" stroke="#475569" stroke-width="0.5"/>
      <circle cx="118" cy="100" r="2.8" fill="url(#silverPlating)" stroke="#475569" stroke-width="0.5"/>
      <circle cx="131" cy="100" r="2.8" fill="url(#silverPlating)" stroke="#475569" stroke-width="0.5"/>
      <line x1="95" y1="94" x2="155" y2="94" stroke="url(#silverPlating)" stroke-width="1"/>

      <!-- Center Tenon Silver Ring -->
      <rect x="161" y="94" width="3" height="12" fill="url(#silverPlating)"/>

      <!-- Lower Joint with Ring Keys & Spatulas -->
      <rect x="164" y="96" width="70" height="8" fill="url(#grenadillaWood)"/>
      <circle cx="178" cy="100" r="2.8" fill="url(#silverPlating)" stroke="#475569" stroke-width="0.5"/>
      <circle cx="191" cy="100" r="2.8" fill="url(#silverPlating)" stroke="#475569" stroke-width="0.5"/>
      <circle cx="204" cy="100" r="2.8" fill="url(#silverPlating)" stroke="#475569" stroke-width="0.5"/>
      <line x1="166" y1="94" x2="228" y2="94" stroke="url(#silverPlating)" stroke-width="1"/>

      <!-- Bell Joint Flare & Silver Rim Ring -->
      <path d="M 234 96 L 255 88 L 255 112 L 234 104 Z" fill="url(#grenadillaWood)"/>
      <rect x="254" y="87" width="3" height="26" rx="1" fill="url(#silverPlating)"/>
    </g>
  </g>
  
  <text x="20" y="186" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">ORCHESTRAL Bb CLARINET</text>
  <text x="280" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">GRENADILLA • BOEHM SYSTEM</text>
</svg>
