<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1318"/>
      <stop offset="50%" stop-color="#2D1520"/>
      <stop offset="100%" stop-color="#100A0D"/>
    </linearGradient>
    <radialGradient id="accSpot" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redPearloid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="40%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <linearGradient id="bellowsFold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="accShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgAcc)"/>
  <circle cx="160" cy="90" r="110" fill="url(#accSpot)"/>
  
  <g filter="url(#accShadow)">
    <!-- Left Bass Button Box -->
    <rect x="40" y="45" width="45" height="105" rx="8" fill="url(#redPearloid)" stroke="#FDA4AF" stroke-width="1.2"/>
    <!-- Bass Buttons Grid -->
    <g fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.5">
      <circle cx="52" cy="60" r="3.2"/> <circle cx="63" cy="60" r="3.2"/> <circle cx="74" cy="60" r="3.2"/>
      <circle cx="52" cy="75" r="3.2"/> <circle cx="63" cy="75" r="3.2"/> <circle cx="74" cy="75" r="3.2"/>
      <circle cx="52" cy="90" r="3.2"/> <circle cx="63" cy="90" r="3.2"/> <circle cx="74" cy="90" r="3.2"/>
      <circle cx="52" cy="105" r="3.2"/> <circle cx="63" cy="105" r="3.2"/> <circle cx="74" cy="105" r="3.2"/>
      <circle cx="52" cy="120" r="3.2"/> <circle cx="63" cy="120" r="3.2"/> <circle cx="74" cy="120" r="3.2"/>
      <circle cx="52" cy="135" r="3.2"/> <circle cx="63" cy="135" r="3.2"/> <circle cx="74" cy="135" r="3.2"/>
    </g>
    
    <!-- Central Pleated Bellows -->
    <g transform="translate(90, 48)">
      <!-- 12 Zigzag Bellows Folds -->
      <polygon points="0,0 6,10 0,20 6,30 0,40 6,50 0,60 6,70 0,80 6,90 0,98 8,98 14,90 8,80 14,70 8,60 14,50 8,40 14,30 8,20 14,10 8,0" fill="#334155" stroke="#94A3B8" stroke-width="0.8"/>
      <polygon points="16,0 22,10 16,20 22,30 16,40 22,50 16,60 22,70 16,80 22,90 16,98 24,98 30,90 24,80 30,70 24,60 30,50 24,40 30,30 24,20 30,10 24,0" fill="#475569" stroke="#E2E8F0" stroke-width="0.8"/>
      <polygon points="32,0 38,10 32,20 38,30 32,40 38,50 32,60 38,70 32,80 38,90 32,98 40,98 46,90 40,80 46,70 40,60 46,50 40,40 46,30 40,20 46,10 40,0" fill="#334155" stroke="#94A3B8" stroke-width="0.8"/>
      <polygon points="48,0 54,10 48,20 54,30 48,40 54,50 48,60 54,70 48,80 54,90 48,98 56,98 62,90 56,80 62,70 56,60 62,50 56,40 62,30 56,20 62,10 56,0" fill="#475569" stroke="#E2E8F0" stroke-width="0.8"/>
      <polygon points="64,0 70,10 64,20 70,30 64,40 70,50 64,60 70,70 64,80 70,90 64,98 72,98 78,90 72,80 78,70 72,60 78,50 72,40 78,30 72,20 78,10 72,0" fill="#334155" stroke="#94A3B8" stroke-width="0.8"/>
      <polygon points="80,0 86,10 80,20 86,30 80,40 86,50 80,60 86,70 80,80 86,90 80,98 88,98 94,90 88,80 94,70 88,60 94,50 88,40 94,30 88,20 94,10 88,0" fill="#475569" stroke="#E2E8F0" stroke-width="0.8"/>
      <polygon points="96,0 102,10 96,20 102,30 96,40 102,50 96,60 102,70 96,80 102,90 96,98 104,98 110,90 104,80 110,70 104,60 110,50 104,40 110,30 104,20 110,10 104,0" fill="#334155" stroke="#94A3B8" stroke-width="0.8"/>
      <polygon points="112,0 118,10 112,20 118,30 112,40 118,50 112,60 118,70 112,80 118,90 112,98 120,98 126,90 120,80 126,70 120,60 126,50 120,40 126,30 120,20 126,10 120,0" fill="#475569" stroke="#E2E8F0" stroke-width="0.8"/>
    </g>
    
    <!-- Right Treble Keyboard Body -->
    <rect x="220" y="45" width="60" height="105" rx="8" fill="url(#redPearloid)" stroke="#FDA4AF" stroke-width="1.2"/>
    
    <!-- Treble Keyboard Vertical Bed -->
    <g transform="translate(254, 48)">
      <!-- Vertical Keys for Piano Accordion -->
      <rect x="0" y="0" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="7.5" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="15" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="22.5" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="30" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="37.5" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="45" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="52.5" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="60" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="67.5" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="75" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="82.5" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="0" y="90" width="22" height="7" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      
      <!-- Black Keys -->
      <rect x="0" y="5" width="13" height="4.5" rx="1" fill="#0F172A"/>
      <rect x="0" y="12.5" width="13" height="4.5" rx="1" fill="#0F172A"/>
      <rect x="0" y="27.5" width="13" height="4.5" rx="1" fill="#0F172A"/>
      <rect x="0" y="35" width="13" height="4.5" rx="1" fill="#0F172A"/>
      <rect x="0" y="42.5" width="13" height="4.5" rx="1" fill="#0F172A"/>
      <rect x="0" y="57.5" width="13" height="4.5" rx="1" fill="#0F172A"/>
      <rect x="0" y="65" width="13" height="4.5" rx="1" fill="#0F172A"/>
      <rect x="0" y="80" width="13" height="4.5" rx="1" fill="#0F172A"/>
      <rect x="0" y="87.5" width="13" height="4.5" rx="1" fill="#0F172A"/>
    </g>
    
    <!-- Grille Sound Vent -->
    <rect x="228" y="55" width="18" height="85" rx="4" fill="#881337" stroke="#FDA4AF" stroke-width="0.8"/>
  </g>
  
  <text x="20" y="186" fill="#FB7185" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CONCERT ACCORDION</text>
  <text x="280" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">BELLOWS • REED CHAMBER</text>
</svg>
