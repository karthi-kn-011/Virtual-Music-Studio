<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12121A"/>
      <stop offset="50%" stop-color="#191724"/>
      <stop offset="100%" stop-color="#0E0E14"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D2240"/>
      <stop offset="50%" stop-color="#1E162D"/>
      <stop offset="100%" stop-color="#0F0B17"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="keyWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bg)"/>
  <circle cx="160" cy="90" r="110" fill="url(#spot)"/>
  
  <!-- Grand Piano Body Silhouette -->
  <g filter="url(#shadow)">
    <!-- Main Rim / Lid -->
    <path d="M 60 120 C 60 70, 110 40, 180 40 C 230 40, 260 65, 260 95 C 260 115, 245 125, 235 125 L 60 125 Z" fill="url(#bodyGrad)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Inner Cast Iron Frame -->
    <path d="M 85 118 C 85 78, 125 55, 175 55 C 215 55, 238 75, 238 98 L 85 118 Z" fill="#181122" stroke="url(#goldRim)" stroke-width="1" stroke-opacity="0.7"/>
    <!-- Strings -->
    <line x1="95" y1="115" x2="160" y2="60" stroke="#FDE68A" stroke-width="0.8" opacity="0.3"/>
    <line x1="110" y1="115" x2="175" y2="60" stroke="#FDE68A" stroke-width="0.8" opacity="0.3"/>
    <line x1="125" y1="115" x2="190" y2="62" stroke="#FDE68A" stroke-width="0.8" opacity="0.3"/>
    <line x1="140" y1="115" x2="205" y2="65" stroke="#FDE68A" stroke-width="0.8" opacity="0.3"/>
    <line x1="155" y1="115" x2="220" y2="70" stroke="#FDE68A" stroke-width="0.8" opacity="0.3"/>
    
    <!-- Prop Stick -->
    <line x1="190" y1="42" x2="170" y2="85" stroke="url(#goldRim)" stroke-width="2"/>
    
    <!-- Keyboard Bed -->
    <rect x="55" y="120" width="185" height="34" rx="2" fill="#0A080F" stroke="#3730A3" stroke-width="1"/>
    
    <!-- White Keys -->
    <g transform="translate(60, 122)">
      <rect x="0" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="12.5" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="25" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="37.5" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="50" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="62.5" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="75" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="87.5" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="100" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="112.5" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="125" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="137.5" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="150" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="162.5" y="0" width="12" height="30" rx="1" fill="url(#keyWhite)" stroke="#94A3B8" stroke-width="0.5"/>
      
      <!-- Black Keys -->
      <rect x="8" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
      <rect x="21" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
      <rect x="46" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
      <rect x="58.5" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
      <rect x="71" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
      <rect x="95.5" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
      <rect x="108" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
      <rect x="133" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
      <rect x="145.5" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
      <rect x="158" y="0" width="7" height="18" rx="1" fill="#0F172A"/>
    </g>
    
    <!-- Piano Legs -->
    <rect x="68" y="154" width="8" height="24" rx="2" fill="#1E162D" stroke="#8B5CF6" stroke-width="0.5"/>
    <rect x="230" y="125" width="8" height="53" rx="2" fill="#1E162D" stroke="#8B5CF6" stroke-width="0.5"/>
    <!-- Lyre & Pedals -->
    <rect x="145" y="154" width="12" height="20" fill="#0A080F"/>
    <circle cx="148" cy="176" r="3" fill="url(#goldRim)"/>
    <circle cx="154" cy="176" r="3" fill="url(#goldRim)"/>
  </g>
  
  <text x="20" y="186" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CLASSICAL CONCERT PIANO</text>
  <text x="270" y="186" fill="#71717A" font-family="monospace" font-size="9" text-anchor="end">88 KEYS • 44.1kHz</text>
</svg>
