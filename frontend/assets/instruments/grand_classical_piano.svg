<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141124"/>
      <stop offset="50%" stop-color="#1F1A3A"/>
      <stop offset="100%" stop-color="#0B0914"/>
    </linearGradient>
    <radialGradient id="spot2" cx="55%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glossEbony" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B2D54"/>
      <stop offset="35%" stop-color="#1E172E"/>
      <stop offset="100%" stop-color="#0B0813"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bg2)"/>
  <circle cx="170" cy="85" r="120" fill="url(#spot2)"/>
  
  <!-- 9-Foot Imperial Concert Grand -->
  <g filter="url(#shadow2)">
    <!-- Open Wing Lid Angle -->
    <path d="M 45 115 L 210 25 L 265 65 L 140 120 Z" fill="#2E2346" stroke="#A855F7" stroke-width="1.5" opacity="0.9"/>
    <!-- Lid reflection beam -->
    <line x1="60" y1="110" x2="200" y2="35" stroke="#E9D5FF" stroke-width="1" opacity="0.4"/>
    
    <!-- Heavy Cast Harp Frame inside -->
    <path d="M 70 120 C 70 80, 110 65, 170 65 C 220 65, 245 80, 245 105 L 70 120 Z" fill="#171124" stroke="url(#gold2)" stroke-width="2"/>
    
    <!-- Resonating Soundboard Strings -->
    <g stroke="url(#gold2)" stroke-width="0.7" opacity="0.45">
      <line x1="80" y1="118" x2="160" y2="70"/>
      <line x1="95" y1="118" x2="175" y2="70"/>
      <line x1="110" y1="118" x2="190" y2="72"/>
      <line x1="125" y1="118" x2="205" y2="76"/>
      <line x1="140" y1="118" x2="220" y2="82"/>
      <line x1="155" y1="118" x2="235" y2="90"/>
    </g>
    
    <!-- Grand Body Contour -->
    <path d="M 45 120 C 45 65, 105 38, 185 38 C 245 38, 275 70, 275 105 C 275 125, 255 125, 240 125 L 45 125 Z" fill="url(#glossEbony)" stroke="#C084FC" stroke-width="1.5"/>
    
    <!-- Keyboard Bed Extended -->
    <rect x="40" y="122" width="205" height="34" rx="3" fill="#08060D" stroke="#6D28D9" stroke-width="1"/>
    
    <!-- White Keys Array -->
    <g transform="translate(45, 124)">
      <rect x="0" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="13" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="26" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="39" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="52" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="65" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="78" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="91" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="104" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="117" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="130" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="143" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="156" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="169" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      <rect x="182" y="0" width="12" height="30" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
      
      <!-- Black Keys -->
      <rect x="9" y="0" width="7" height="18" rx="1" fill="#09090B"/>
      <rect x="22" y="0" width="7" height="18" rx="1" fill="#09090B"/>
      <rect x="48" y="0" width="7" height="18" rx="1" fill="#09090B"/>
      <rect x="61" y="0" width="7" height="18" rx="1" fill="#09090B"/>
      <rect x="74" y="0" width="7" height="18" rx="1" fill="#09090B"/>
      <rect x="100" y="0" width="7" height="18" rx="1" fill="#09090B"/>
      <rect x="113" y="0" width="7" height="18" rx="1" fill="#09090B"/>
      <rect x="139" y="0" width="7" height="18" rx="1" fill="#09090B"/>
      <rect x="152" y="0" width="7" height="18" rx="1" fill="#09090B"/>
      <rect x="165" y="0" width="7" height="18" rx="1" fill="#09090B"/>
    </g>
    
    <!-- Spade Feet Legs -->
    <path d="M 55 156 L 63 156 L 65 180 L 53 180 Z" fill="#1C142A" stroke="#8B5CF6" stroke-width="0.5"/>
    <path d="M 245 125 L 253 125 L 255 180 L 243 180 Z" fill="#1C142A" stroke="#8B5CF6" stroke-width="0.5"/>
    <!-- Triple Solid Brass Pedals -->
    <rect x="135" y="156" width="18" height="18" fill="#0D0915"/>
    <circle cx="139" cy="177" r="3" fill="url(#gold2)"/>
    <circle cx="144" cy="177" r="3" fill="url(#gold2)"/>
    <circle cx="149" cy="177" r="3" fill="url(#gold2)"/>
  </g>
  
  <text x="20" y="186" fill="#C084FC" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">GRAND CONCERT MASTER</text>
  <text x="280" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">YAMAHA C7 • 9-FOOT</text>
</svg>
