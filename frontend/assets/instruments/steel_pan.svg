<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1D1D"/>
      <stop offset="50%" stop-color="#132E2E"/>
      <stop offset="100%" stop-color="#081414"/>
    </linearGradient>
    <radialGradient id="panSpot" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="concaveBowl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="85%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>
    <linearGradient id="chromeRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="panShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#bgPan)"/>
  <circle cx="160" cy="90" r="110" fill="url(#panSpot)"/>
  
  <g filter="url(#panShadow)">
    <!-- 55-Gallon Steel Drum Sunken Concave Head (Trinidad Steelpan) -->
    <!-- Heavy Chrome Cylindrical Rim -->
    <ellipse cx="160" cy="92" rx="76" ry="58" fill="url(#chromeRim)" stroke="#2DD4BF" stroke-width="1.5"/>
    <!-- Deep Sunk Concave Playing Basin -->
    <ellipse cx="160" cy="92" rx="70" ry="52" fill="url(#concaveBowl)"/>

    <!-- Hand-Hammered Note Grooves (Grooved Dents) -->
    <!-- Center Low Pitch Note Fields -->
    <ellipse cx="160" cy="92" rx="15" ry="11" fill="#475569" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Inner Ring of Notes -->
    <ellipse cx="160" cy="65" rx="14" ry="9" fill="#475569" stroke="#E2E8F0" stroke-width="0.8"/>
    <ellipse cx="188" cy="74" rx="14" ry="10" fill="#475569" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(30 188 74)"/>
    <ellipse cx="196" cy="100" rx="13" ry="9" fill="#475569" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(75 196 100)"/>
    <ellipse cx="178" cy="122" rx="14" ry="9" fill="#475569" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(130 178 122)"/>
    <ellipse cx="142" cy="122" rx="14" ry="9" fill="#475569" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(50 142 122)"/>
    <ellipse cx="124" cy="100" rx="13" ry="9" fill="#475569" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(105 124 100)"/>
    <ellipse cx="132" cy="74" rx="14" ry="10" fill="#475569" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(150 132 74)"/>

    <!-- Outer High-Pitch Note Periphery Sections -->
    <ellipse cx="160" cy="48" rx="16" ry="7" fill="#334155" stroke="#CBD5E1" stroke-width="0.7"/>
    <ellipse cx="205" cy="58" rx="16" ry="8" fill="#334155" stroke="#CBD5E1" stroke-width="0.7" transform="rotate(25 205 58)"/>
    <ellipse cx="222" cy="92" rx="8" ry="15" fill="#334155" stroke="#CBD5E1" stroke-width="0.7"/>
    <ellipse cx="205" cy="126" rx="16" ry="8" fill="#334155" stroke="#CBD5E1" stroke-width="0.7" transform="rotate(-25 205 126)"/>
    <ellipse cx="160" cy="136" rx="16" ry="7" fill="#334155" stroke="#CBD5E1" stroke-width="0.7"/>
    <ellipse cx="115" cy="126" rx="16" ry="8" fill="#334155" stroke="#CBD5E1" stroke-width="0.7" transform="rotate(25 115 126)"/>
    <ellipse cx="98" cy="92" rx="8" ry="15" fill="#334155" stroke="#CBD5E1" stroke-width="0.7"/>
    <ellipse cx="115" cy="58" rx="16" ry="8" fill="#334155" stroke="#CBD5E1" stroke-width="0.7" transform="rotate(-25 115 58)"/>

    <!-- Rubber-Tipped Mallets -->
    <line x1="75" y1="165" x2="135" y2="115" stroke="#FDE68A" stroke-width="2.5"/>
    <rect x="135" y="110" width="10" height="9" rx="3" fill="#EF4444"/>
    
    <line x1="245" y1="165" x2="185" y2="115" stroke="#FDE68A" stroke-width="2.5"/>
    <rect x="175" y="110" width="10" height="9" rx="3" fill="#EF4444"/>
  </g>
  
  <text x="20" y="186" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CARIBBEAN STEEL PAN</text>
  <text x="280" y="186" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="end">TRINIDAD & TOBAGO • CHROMATIC</text>
</svg>
